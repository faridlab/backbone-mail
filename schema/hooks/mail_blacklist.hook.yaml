# =============================================================================
# MailBlacklistHooks — write-path guard on mail.blacklist (M24).
# G-MAIL-2: unique(email). Enforced by @unique on MailBlacklist.email
# (declared on the model; fires on raw SQL in v19).
#
# Case: the unique is on the stored value, and the trigger
# mail_blacklists_fold_email lower-cases every write before it is stored, so
# the unique holds one row per address regardless of case, for any writer.
# =============================================================================

name: MailBlacklistHooks
model: MailBlacklist

rules:
  G-MAIL-2:
    when: [create, update]
    condition: "email is unique across blacklist rows (as stored — the service lowercases before write)"
    message: "Duplicate blacklisted address — enforced by @unique on MailBlacklist.email. The address is stored LOWERCASED; the write service folds case before insert."
    code: mail_blacklist_duplicate_email
    severity: error
    enforcement: both
    enforced_by: "migrations/20261017150000_mail_blacklist_fold_email.up.sql::mail_blacklists_fold_email"
    justification: "The trigger mail_blacklists_fold_email lower-cases the address on every insert and every update of email, from any writer (mass mailing's bounce sweep, generic CRUD, raw SQL), so the unique index on email holds one row per address regardless of case; its migration merged the case duplicates written before it (tests/behavior/mail_headers_cases.rs a_raw_mixed_case_write_folds_onto_the_one_row)."
