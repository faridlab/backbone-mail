openapi: '3.0.3'
info:
  title: Backbone API
  version: '1.0.0'
  description: |
    Auto-generated by backbone-cli.
    This API provides 11 standard CRUD endpoints for each model.

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Examples
    description: Example management endpoints

paths:
  /api/v1/examples:
    get:
      tags:
        - Examples
      summary: List Examples
      description: Get a paginated list of Examples with optional filtering and sorting
      operationId: listExamples
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Examples
      summary: Create Example
      description: Create a new Example
      operationId: createExample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExampleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/examples/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'

    get:
      tags:
        - Examples
      summary: Get Example by ID
      operationId: getExample
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Examples
      summary: Update Example (full)
      operationId: updateExample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExampleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Examples
      summary: Update Example (partial)
      operationId: patchExample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchExampleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Examples
      summary: Delete Example (soft)
      operationId: deleteExample
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/examples/bulk:
    post:
      tags:
        - Examples
      summary: Bulk create Examples
      operationId: bulkCreateExamples
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateExampleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Example'
    put:
      tags:
        - Examples
      summary: Bulk update Examples (full, atomic)
      operationId: bulkUpdateExamples
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                allOf:
                  - type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                  - $ref: '#/components/schemas/UpdateExampleRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags:
        - Examples
      summary: Bulk partial-update Examples (atomic)
      operationId: bulkPatchExamples
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ids, patch]
                  properties:
                    ids:
                      type: array
                      items: { type: string }
                    patch:
                      type: object
                      additionalProperties: true
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        required: [id, patch]
                        properties:
                          id: { type: string }
                          patch: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/examples/upsert:
    post:
      tags:
        - Examples
      summary: Upsert Example
      operationId: upsertExample
      parameters:
        - name: key_field
          in: query
          schema:
            type: string
        - name: key_value
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExampleRequest'
      responses:
        '200':
          description: Upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'

  /api/v1/examples/trash:
    get:
      tags:
        - Examples
      summary: List deleted Examples
      operationId: listDeletedExamples
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleList'

  /api/v1/examples/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    post:
      tags:
        - Examples
      summary: Restore deleted Example
      operationId: restoreExample
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Example'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/examples/empty:
    delete:
      tags:
        - Examples
      summary: Empty trash for Examples
      operationId: emptyTrashExamples
      responses:
        '200':
          description: Trash emptied
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_count:
                    type: integer

  /api/v1/examples/delete/bulk:
    post:
      tags:
        - Examples
      summary: Bulk soft-delete Examples by ids (atomic)
      operationId: bulkDeleteExamples
      requestBody:
        $ref: '#/components/requestBodies/BatchIds'
      responses:
        '200':
          description: Soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  soft_deleted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/examples/restore/bulk:
    post:
      tags:
        - Examples
      summary: Bulk restore Examples by ids (atomic)
      operationId: bulkRestoreExamples
      requestBody:
        $ref: '#/components/requestBodies/BatchIds'
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/examples/restore/all:
    post:
      tags:
        - Examples
      summary: Restore all soft-deleted Examples
      operationId: restoreAllExamples
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored: { type: integer }

  /api/v1/examples/trash/bulk:
    delete:
      tags:
        - Examples
      summary: Bulk permanently-delete Examples from trash by ids (atomic)
      operationId: bulkPermanentDeleteExamples
      requestBody:
        $ref: '#/components/requestBodies/BatchIds'
      responses:
        '200':
          description: Permanently deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  permanently_deleted: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    Example:
      type: object
      required:
        - id
        - name
        - status
        - metadata
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          nullable: true
          type: string
        status:
          type: string
        metadata:
          type: object

    ExampleBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Example'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateExampleRequest:
      type: object
      required:
        - name
        - status
        - metadata
      properties:
        name:
          type: string
        description:
          nullable: true
          type: string
        status:
          type: string
        metadata:
          type: object

    UpdateExampleRequest:
      type: object
      required:
        - name
        - status
        - metadata
      properties:
        name:
          type: string
        description:
          nullable: true
          type: string
        status:
          type: string
        metadata:
          type: object

    PatchExampleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          nullable: true
          type: string
        status:
          type: string
        metadata:
          type: object

    ExampleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Example'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total_pages:
          type: integer
          example: 5

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid input data
        details:
          type: object
          additionalProperties: true

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortByParam:
      name: sort_by
      in: query
      schema:
        type: string

    SortOrderParam:
      name: sort_order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  requestBodies:
    BatchIds:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                type: array
                items: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
