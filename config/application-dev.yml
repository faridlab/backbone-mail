server:
  host: 127.0.0.1
database:
  url: postgresql://root:password@localhost:5432/messaging_dev
  max_connections: 5
logging:
  level: debug
  format: pretty
tracing:
  enabled: false
metrics:
  enabled: false
sms:
  endpoint: ${SMS_API_ENDPOINT:http://localhost:9099}
  sender: ${SMS_SENDER:backbone-dev}
  api_token: ${SMS_API_TOKEN}
outbox:
  schema: messaging
  company_id: 00000000-0000-0000-0000-000000000000
